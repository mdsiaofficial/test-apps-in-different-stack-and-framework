[package]
name = "rust-axum"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tower = "0.7.0-rc4"
tower-http = { version = "0.7", features = ["trace"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"

[profile.dev]
opt-level = 1
